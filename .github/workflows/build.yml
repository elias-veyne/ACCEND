name: Build ACCEND

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 35
        run: yes | sdkmanager --licenses > /dev/null && sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle (cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Read version
        id: ver
        run: |
          NAME=$(grep -E '^APP_VERSION_NAME=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          if [ -z "$NAME" ]; then echo "APP_VERSION_NAME missing in gradle.properties" >&2; exit 1; fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Prepare release signing
        id: sign
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "file=$RUNNER_TEMP/release.keystore" >> "$GITHUB_OUTPUT"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Release signing secrets are missing. Refusing to publish an unsigned APK."
            exit 1
          fi

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build release APK
        env:
          KEYSTORE_FILE: ${{ steps.sign.outputs.file }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Collect APK
        id: apk
        run: |
          mkdir -p dist
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)
          if [ -z "$APK" ]; then echo "No APK produced by assembleRelease" >&2; exit 1; fi
          cp "$APK" "dist/ACCEND-v${{ steps.ver.outputs.name }}.apk"
          echo "file=dist/ACCEND-v${{ steps.ver.outputs.name }}.apk" >> "$GITHUB_OUTPUT"

      - name: Verify signed APK
        env:
          APK: ${{ steps.apk.outputs.file }}
        run: |
          SDK_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          echo "Verifying $APK"
          "$SDK_TOOLS/apksigner" verify --verbose --min-sdk-version 24 "$APK" > apksigner.log 2>&1
          cat apksigner.log
          grep -q "Verified using v1 scheme" apksigner.log
          grep -q "Verified using v2 scheme" apksigner.log
          PACKAGE=$("$SDK_TOOLS/aapt" dump badging "$APK" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
          echo "Package: $PACKAGE"
          if [ "$PACKAGE" != "com.accend.app" ]; then
            echo "::error::Unexpected applicationId: $PACKAGE" >&2
            exit 1
          fi
          VERSION_CODE=$("$SDK_TOOLS/aapt" dump badging "$APK" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")
          echo "versionCode: $VERSION_CODE (workflow run $GITHUB_RUN_NUMBER)"

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ACCEND-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.ver.outputs.name }}
          TITLE: ACCEND v${{ steps.ver.outputs.name }}
          APK: ${{ steps.apk.outputs.file }}
        run: |
          gh release delete "$TAG" --cleanup-tag --yes || true
          gh release create "$TAG" "$APK" \
            --target "$GITHUB_SHA" \
            --title "$TITLE" \
            --generate-notes
